<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paste & Read</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --border: #c9c9c9; --btn: #f1f1f1; --accent: #2563eb;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --border: #444; --btn: #262626; --accent: #6aa0ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --border: #444; --btn: #262626; --accent: #6aa0ff;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
  textarea { width: 100%; height: 250px; font-size: 16px; padding: 10px; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; }
  button { padding: 10px 18px; font-size: 16px; background: var(--btn); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  label { display: flex; align-items: center; gap: 6px; }
  select { max-width: 100%; padding: 6px; background: var(--btn); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
  #status { color: var(--muted); margin-top: 12px; min-height: 1.2em; }
  #now { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; line-height: 1.45; display: none; }
  #now.show { display: block; }
</style>
</head>
<body>
  <h2>Paste text and listen</h2>
  <textarea id="text" placeholder="Paste your text here..."></textarea>
  <div class="row">
    <button id="mainBtn">Read</button>
    <button id="stopBtn">Stop</button>
    <button id="backBtn">Back</button>
    <button id="nextBtn">Next</button>
  </div>
  <div class="row">
    <label>Speed: <input type="range" id="rate" min="0.5" max="2.5" step="0.1" value="1"> <span id="rateVal">1.0x</span></label>
    <label>Voice: <select id="voices"></select></label>
  </div>
  <div id="status"></div>
  <div id="now"></div>
  <script>
    const synth = window.speechSynthesis;
    const $ = id => document.getElementById(id);
    const voiceSel = $('voices'), rateEl = $('rate'), mainBtn = $('mainBtn'), statusEl = $('status'), nowEl = $('now');
    let voices = [];
    let chunks = [], idx = 0, session = 0;
    let paused = false;
    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function loadVoices() {
      const all = synth.getVoices();
      if (!all.length) return;
      const lang = (navigator.language || 'en').toLowerCase();
      const base = lang.split('-')[0];
      const rank = v => {
        const l = v.lang.toLowerCase();
        return l === lang ? 0 : l.startsWith(base) ? 1 : 2;
      };
      voices = all.slice().sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
      voiceSel.innerHTML = '';
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSel.appendChild(opt);
      });
      const saved = load('pr_voice');
      const savedIdx = voices.findIndex(v => v.voiceURI === saved);
      const defIdx = voices.findIndex(v => v.default && rank(v) < 2);
      voiceSel.value = savedIdx >= 0 ? savedIdx : defIdx >= 0 ? defIdx : 0;
    }
    loadVoices();
    synth.addEventListener('voiceschanged', loadVoices);
    let tries = 0;
    const poll = setInterval(() => {
      if (voices.length || ++tries > 20) return clearInterval(poll);
      loadVoices();
    }, 250);
    function splitText(text) {
      const sentences = text.replace(/\r/g, '').match(/[^.!?\n]+[.!?]*["')\]]*\s*|\n+/g) || [];
      const out = [];
      for (let s of sentences) {
        s = s.trim();
        if (!s) continue;
        while (s.length > 180) {
          let cut = s.lastIndexOf(',', 180);
          if (cut < 60) cut = s.lastIndexOf(' ', 180);
          if (cut < 1) cut = 180;
          out.push(s.slice(0, cut + 1).trim());
          s = s.slice(cut + 1).trim();
        }
        if (s) out.push(s);
      }
      return out;
    }
    function labelMain() {
      if (!chunks.length || idx >= chunks.length) mainBtn.textContent = 'Read';
      else if (paused) mainBtn.textContent = 'Resume';
      else mainBtn.textContent = 'Pause';
    }
    function setStatus() {
      if (!chunks.length) {
        statusEl.textContent = '';
        nowEl.className = '';
        nowEl.textContent = '';
        labelMain();
        $('backBtn').disabled = true;
        $('nextBtn').disabled = true;
        return;
      }
      const done = idx >= chunks.length;
      const n = Math.min(idx + 1, chunks.length);
      statusEl.textContent = (done ? 'Done' : paused ? 'Paused' : 'Reading') + `: sentence ${n} of ${chunks.length}`;
      nowEl.className = 'show';
      nowEl.textContent = done ? 'End of text' : chunks[idx];
      $('backBtn').disabled = idx <= 0 && !done;
      $('nextBtn').disabled = done;
      labelMain();
    }
    function speakNext(sid) {
      if (sid !== session) return;
      if (idx >= chunks.length) { paused = false; setStatus(); return; }
      const u = new SpeechSynthesisUtterance(chunks[idx]);
      const v = voices[voiceSel.value];
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = parseFloat(rateEl.value);
      u.onend = () => { if (sid !== session) return; idx++; speakNext(sid); };
      u.onerror = e => {
        if (sid !== session || e.error === 'canceled' || e.error === 'interrupted') return;
        idx++; speakNext(sid);
      };
      synth.speak(u);
      if (synth.paused) synth.resume();
      setStatus();
    }
    function playFrom(i) {
      if (!chunks.length) return;
      session++;
      synth.cancel();
      paused = false;
      idx = Math.max(0, Math.min(i, chunks.length - 1));
      speakNext(session);
    }
    function speak() {
      const text = $('text').value;
      if (!text.trim()) return;
      chunks = splitText(text);
      playFrom(0);
    }
    function stop() {
      session++;
      synth.cancel();
      paused = false; idx = 0; chunks = [];
      setStatus();
    }
    function togglePause() {
      if (!chunks.length || idx >= chunks.length) return;
      if (paused) playFrom(idx);
      else {
        session++;
        synth.cancel();
        paused = true;
        setStatus();
      }
    }
    function onMain() {
      if (!chunks.length || idx >= chunks.length) speak();
      else togglePause();
    }
    function skip(delta) {
      if (!chunks.length) return;
      if (idx >= chunks.length && delta > 0) return;
      const base = idx >= chunks.length ? chunks.length : idx;
      const target = base + delta;
      if (target >= chunks.length) {
        session++;
        synth.cancel();
        paused = false;
        idx = chunks.length;
        setStatus();
        return;
      }
      playFrom(Math.max(0, target));
    }
    rateEl.addEventListener('input', () => {
      $('rateVal').textContent = parseFloat(rateEl.value).toFixed(1) + 'x';
      store('pr_rate', rateEl.value);
      if (!chunks.length || idx >= chunks.length || paused) return;
      if (synth.speaking) playFrom(idx);
    });
    voiceSel.addEventListener('change', () => {
      const v = voices[voiceSel.value];
      if (v) store('pr_voice', v.voiceURI);
      if (chunks.length && idx < chunks.length && !paused && synth.speaking) playFrom(idx);
    });
    mainBtn.addEventListener('click', onMain);
    $('stopBtn').addEventListener('click', stop);
    $('backBtn').addEventListener('click', () => skip(-1));
    $('nextBtn').addEventListener('click', () => skip(1));
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); onMain(); }
      else if (e.code === 'Escape') stop();
      else if (e.code === 'ArrowRight') { e.preventDefault(); skip(1); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); skip(-1); }
    });
    window.addEventListener('beforeunload', () => synth.cancel());
    const savedRate = load('pr_rate');
    if (savedRate && savedRate <= 2.5 && savedRate >= 0.5) {
      rateEl.value = savedRate;
      $('rateVal').textContent = parseFloat(savedRate).toFixed(1) + 'x';
    }
    setStatus();
    if (!('speechSynthesis' in window)) statusEl.textContent = 'Speech synthesis is not supported in this browser.';
  </script>
</body>
</html>
